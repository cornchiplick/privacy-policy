<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>개인정보 처리방침</title>
<style>
  :root{ --bg:#fff; --fg:#1a1a1a; --muted:#666; --line:#e5e5e5; --accent:#2d6a4f; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#16181a; --fg:#e8e8e8; --muted:#a0a0a0; --line:#303336; --accent:#74c69d; }
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--fg);
    font:16px/1.7 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",system-ui,sans-serif;}
  .wrap{max-width:640px; margin:0 auto; padding:64px 20px}
  h1{font-size:1.6rem; margin:0 0 6px; letter-spacing:-.02em}
  p.lede{color:var(--muted); margin:0 0 32px; font-size:.95rem}
  ul{list-style:none; padding:0; margin:0}
  li{border:1px solid var(--line); border-radius:10px; margin:10px 0}
  li a{display:block; padding:16px 18px; text-decoration:none; color:var(--fg)}
  li a:hover{border-color:var(--accent)}
  .name{font-weight:600}
  .desc{color:var(--muted); font-size:.88rem; margin-top:3px}
  footer{margin-top:48px; padding-top:18px; border-top:1px solid var(--line); color:var(--muted); font-size:.85rem}
</style>
</head>
<body>
<div class="wrap">
  <h1>개인정보 처리방침</h1>
  <p class="lede">앱별 개인정보 처리방침 문서입니다.</p>

  <ul>
    <li>
      <a href="./dogiary/privacy.html">
        <span class="name">Dogiary</span>
        <div class="desc">반려견 기록 앱 · 개인정보 처리방침</div>
      </a>
    </li>
  </ul>

  <footer>
    문의: minnngg99@gmail.com
  </footer>
</div>
</body>
</html>
